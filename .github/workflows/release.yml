name: Release

# Runs semantic-release on every push to the default branch. It analyses
# Conventional Commits, writes CHANGELOG.md, bumps package.json/package-lock.json,
# pushes a `vX.Y.Z` git tag and opens the matching GitHub Release.
#
# IMPORTANT: this workflow intentionally does NOT publish to npm.
# `@semantic-release/npm` is configured with `"npmPublish": false`, so the actual
# `npm publish` is performed exactly once by `publish.yml`, which is triggered by
# the `v*` tag push this workflow creates. This split prevents a double publish.
on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
