name: Publish Package to NPM

# Single source of truth for npm publishing. The `Release` workflow runs
# semantic-release on pushes to `master`, which creates and pushes the `vX.Y.Z`
# tag (and bumps package.json). That tag push is what triggers this workflow.
#
# Do NOT also trigger this on `release: published` — semantic-release creates a
# GitHub Release for the same tag, which would result in a double npm publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
