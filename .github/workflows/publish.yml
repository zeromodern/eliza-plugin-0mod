name: Publish Package to NPM

# Single source of truth for npm publishing. Publishing is triggered ONLY when
# the owner manually creates a GitHub Release (which creates the `vX.Y.Z` tag).
# The owner chooses the version bump by running `npm version <major|minor|patch>`
# before creating the release. The auto-tagging semantic-release workflow was
# removed so pushes to `master` never cut versions or publish on their own.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Guard: the GitHub Release tag (e.g. `v1.4.0`) MUST match the version in
      # package.json. This prevents publishing a version that differs from the
      # tag the owner manually cut. Fails loudly on mismatch.
      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}. Refusing to publish."
            exit 1
          fi
          echo "OK: release tag v${TAG_VERSION} matches package.json version ${PKG_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
